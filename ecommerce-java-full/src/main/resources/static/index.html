<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Online Shop - Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
  <h1>Products (Demo)</h1>
  <div id="products" class="row"></div>
</div>

<script>
async function loadProducts(){
  const res = await fetch('/api/products');
  const prods = await res.json();
  const out = document.getElementById('products');
  out.innerHTML = prods.map(p => `
    <div class="col-md-4">
      <div class="card mb-3">
        <img src="${p.imageUrl || 'https://via.placeholder.com/300'}" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">${p.name}</h5>
          <p class="card-text">${(p.description||'').substring(0,120)}</p>
          <p><strong>₹ ${p.price}</strong></p>
          <button class="btn btn-primary" onclick="addToCart(${p.id})">Add to cart</button>
        </div>
      </div>
    </div>`).join('');
}

async function addToCart(productId){
  let userId = prompt('Enter your user id (for demo):');
  await fetch('/api/cart/items', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ userId: Number(userId), productId: productId, qty: 1 })
  });
  alert('Added to cart');
}

loadProducts();
</script>
</body>
</html>
